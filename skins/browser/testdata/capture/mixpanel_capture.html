<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mixpanel Capture</title></head>
<body>
<h1>Mixpanel Capture Harness</h1>
<div id="status">Loading SDK...</div>
<script src="https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js"></script>
<script>
  const TOKEN = window.__MIXPANEL_TOKEN__ || "REPLACE_ME";
  mixpanel.init(TOKEN, {
    batch_requests: false,
    api_transport: "XHR",
    api_payload_format: "json",
    debug: true
  });

  const events = [
    ...Array.from({length: 30}, (_, i) => ({
      kind: "track",
      name: ["page_view", "button_click", "feature_used", "form_submit", "scroll_depth", "video_play", "search_performed", "share_clicked", "purchase_initiated", "signup_completed"][i % 10],
      props: {
        page: `/page-${i}`,
        category: ["nav","cta","content","footer","header"][i % 5],
        value: i * 1.5,
        timestamp_iso: new Date(Date.now() - i*60000).toISOString()
      }
    })),
    ...Array.from({length: 10}, (_, i) => ({
      kind: "identify", name: null, props: { userId: `user_${i}` }
    })),
    ...Array.from({length: 5}, (_, i) => ({
      kind: "people_set", name: null,
      props: { plan: ["free","pro","enterprise"][i % 3], cohort: `cohort_${i}` }
    })),
    ...Array.from({length: 5}, (_, i) => ({
      kind: "register", name: null,
      props: { app_version: `1.${i}.0`, platform: "web" }
    })),
    ...Array.from({length: 5}, (_, i) => ({
      kind: "time_event", name: `timed_event_${i}`, props: { context: `ctx_${i}` }
    })),
  ];

  async function run() {
    document.getElementById("status").textContent = "Sending events...";
    for (const e of events) {
      try {
        switch (e.kind) {
          case "track": mixpanel.track(e.name, e.props); break;
          case "identify": mixpanel.identify(e.props.userId); break;
          case "people_set": mixpanel.people.set(e.props); break;
          case "register": mixpanel.register(e.props); break;
          case "time_event":
            mixpanel.time_event(e.name);
            await new Promise(r => setTimeout(r, 100));
            mixpanel.track(e.name, e.props);
            break;
        }
        await new Promise(r => setTimeout(r, 80));
      } catch (err) { console.error("event failed:", e, err); }
    }
    if (typeof mixpanel.opt_in_tracking === "function") mixpanel.opt_in_tracking();
    await new Promise(r => setTimeout(r, 2000));
    document.getElementById("status").textContent = "DONE";
    document.title = "CAPTURE_COMPLETE";
  }
  run();
</script>
</body></html>
